const form=document.getElementById('unlockForm'),field=document.getElementById('password'),button=document.getElementById('unlock'),status=document.getElementById('status');
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
form.addEventListener('submit',async e=>{
e.preventDefault();
if(!crypto.subtle||typeof DecompressionStream==='undefined'){status.textContent='최신 Chrome 또는 Edge에서 열어 주세요.';return;}
let password=field.value;if(!password){status.textContent='강사용 비밀번호를 입력해 주세요.';field.focus();return;}
button.disabled=true;status.textContent='강의안을 여는 중입니다…';form.setAttribute('aria-busy','true');
try{
const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
const packed=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.ciphertext));
const stream=new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'));
const html=await new Response(stream).text();password='';field.value='';document.open();document.write(html);document.close();
}catch(err){password='';field.value='';status.textContent='비밀번호가 맞지 않거나 강의안을 열 수 없습니다. 다시 확인해 주세요.';button.disabled=false;form.removeAttribute('aria-busy');field.focus();}
});
})();</script></body></html>
